<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a6b3b" />
  <title>麻雀得点計算機</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">麻雀得点計算機</h1>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="設定">⚙ 設定</button>
  </header>

  <nav class="tabs" role="tablist">
    <button id="tabPhoto" class="tab" role="tab" aria-selected="false" type="button">写真で計算</button>
    <button id="tabManual" class="tab is-active" role="tab" aria-selected="true" type="button">手入力で計算</button>
  </nav>

  <main class="content">
    <!-- 写真で計算 -->
    <section id="panelPhoto" class="panel" role="tabpanel" hidden>
      <div class="photo-controls">
        <button id="captureBtn" class="primary-btn" type="button">📷 撮影</button>
        <button id="pickBtn" class="secondary-btn" type="button">🖼 画像を選択</button>
      </div>
      <div id="photoPreview" class="photo-preview" hidden>
        <img id="photoImg" alt="認識する画像" />
      </div>
      <div id="photoStatus" class="status" role="status" aria-live="polite"></div>

      <div id="photoHandSection" class="hand-section">
        <h2 class="section-title">認識した牌（タップで削除・修正可）</h2>
        <div id="photoHandChips" class="hand-chips" aria-live="polite"></div>
        <div class="quick-add-row">
          <input id="photoQuickInput" class="quick-input" type="text"
                 inputmode="latin" placeholder="追加: 例 123m45p7z" />
          <button id="photoQuickAddBtn" class="secondary-btn small" type="button">追加</button>
        </div>
        <button id="photoCalcBtn" class="primary-btn wide" type="button">得点表を計算</button>
      </div>

      <div id="photoResult" class="result-area" aria-live="polite"></div>
    </section>

    <!-- 手入力で計算 -->
    <section id="panelManual" class="panel" role="tabpanel">
      <div id="handbuilder"></div>
      <div id="manualResult" class="result-area" aria-live="polite"></div>
    </section>
  </main>

  <!-- API キー設定モーダル -->
  <div id="settingsModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle" class="modal-title">画像認識 API 設定</h2>
      <label class="field-label" for="providerSelect">プロバイダ</label>
      <select id="providerSelect" class="field-input">
        <option value="gemini">Gemini（既定）</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
      </select>
      <label class="field-label" for="apiKeyInput">API キー</label>
      <input id="apiKeyInput" class="field-input" type="password"
             autocomplete="off" placeholder="sk-... / AIza..." />
      <p class="field-note">キーはこの端末の localStorage にのみ保存され、サーバーには送信されません。手入力での計算はキー無しで動作します。</p>
      <div class="modal-actions">
        <button id="settingsCancel" class="secondary-btn" type="button" data-close>閉じる</button>
        <button id="settingsSave" class="primary-btn" type="button">保存</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
